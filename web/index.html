<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spazz Radar</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <!-- Include Leaflet CSS if using the map background -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

  <!-- The pulse animation element -->
  <div id="radar-pulse"></div>

  <!-- Status & Discovery Overlays -->
  <div id="status">SCANNING...</div>
  <div id="discovery-card" style="display: none;">
    <div id="proximity-fill" style="height: 0%;"></div>
  </div>

  <!-- Map container (optional on user screen, active on admin) -->
  <div id="map" style="width: 100vw; height: 100vh;"></div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/js/radar.js"></script>
</body>
</html>
